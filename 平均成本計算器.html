<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國泰證券 - 極簡保本試算器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 450px; margin: 20px auto; padding: 15px; background-color: #f4f6f8; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { color: #00704A; text-align: center; margin-top: 0; font-size: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; color: #333; }
        select, input { width: 100%; padding: 12px; margin-top: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        input:focus, select:focus { border-color: #00704A; outline: none; }
        button { width: 100%; background: #00704A; color: white; border: none; padding: 14px; font-size: 17px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #005638; }
        .result-box { margin-top: 20px; padding: 18px; background: #e8f5e9; border-radius: 8px; font-size: 15px; line-height: 1.7; border-left: 5px solid #00704A; }
        .highlight { color: #d32f2f; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>國泰證券保本試算器 📊</h2>
    
    <label>1. 標的類型</label>
    <select id="stockType">
        <option value="0.003">一般個股 (證交稅 0.3%)</option>
        <option value="0.001">股票型 ETF (證交稅 0.1%)</option>
    </select>

    <label>2. 累積總股數 (股)</label>
    <input type="number" id="totalShares" placeholder="例如: 21 或 350">

    <label>3. 成交均價 (元)</label>
    <input type="number" id="avgPrice" step="0.01" placeholder="例如: 80.71 或 105.5">

    <label>4. 累積買進扣款次數 (次)</label>
    <input type="number" id="buyCount" value="1" placeholder="例如: 5">

    <button type="button" onclick="calculateBreakeven()">🎯 算出賣出保本價格</button>

    <div id="result" class="result-box" style="display:none;"></div>
</div>

<script>
function calculateBreakeven() {
    const taxRate = parseFloat(document.getElementById('stockType').value);
    const shares = parseFloat(document.getElementById('totalShares').value) || 0;
    const avgPrice = parseFloat(document.getElementById('avgPrice').value) || 0;
    const buyCount = parseInt(document.getElementById('buyCount').value) || 0;

    if (shares <= 0 || avgPrice <= 0 || buyCount <= 0) {
        alert("請完整輸入股數、均價與買進次數！");
        return;
    }

    // 計算股票總價值與買进手續費（每次預設固定 1 元）
    const totalBuyAmount = Math.round(shares * avgPrice);
    const totalBuyFee = buyCount * 1; 
    const totalCost = totalBuyAmount + totalBuyFee;

    // 反推賣出保本單價
    // 賣出金額 * (1 - 賣出手續費率 - 證交稅率) >= 總成本
    // 賣出手續費預設以國泰零股最低低消 1 元或 2.8 折計算
    const discountFeeRate = 0.001425 * 0.28;
    const netFactor = 1 - discountFeeRate - taxRate;
    
    let minSellAmount = totalCost / netFactor;
    let minSellPrice = minSellAmount / shares;

    // 計算賣出時的手續費，若小於 1 元則以低消 1 元校正
    let estimatedSellFee = Math.floor(minSellAmount * discountFeeRate);
    if (estimatedSellFee < 1) {
        minSellAmount = (totalCost + 1) / (1 - taxRate);
        minSellPrice = minSellAmount / shares;
    }

    const requiredGainPct = ((minSellPrice - avgPrice) / avgPrice) * 100;

    const resultDiv = document.getElementById('result');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `
        <strong>📊 試算結果彙整：</strong><br>
        📦 累積總股數：<b>${shares.toLocaleString()}</b> 股<br>
        📉 成交均價：<b>${avgPrice.toFixed(2)}</b> 元<br>
        🧾 買進手續費：<b>${totalBuyFee}</b> 元 (扣款 ${buyCount} 次 × 1元)<br>
        💰 總投入總成本：<b>${totalCost.toLocaleString()}</b> 元<br>
        <hr style="border:0; border-top:1px dashed #aaa; margin:10px 0;">
        🎯 賣出保本單價：<span class="highlight">${minSellPrice.toFixed(2)} 元</span><br>
        📈 股價需上漲：<b>+${requiredGainPct.toFixed(2)}%</b>
    `;
}
</script>

</body>
</html>
